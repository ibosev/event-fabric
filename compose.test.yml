name: event-fabric-test
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: eventfabric
      POSTGRES_USER: eventfabric
      POSTGRES_DB: eventfabric
    ports: ["127.0.0.1:55439:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventfabric"]
      interval: 1s
      timeout: 5s
      retries: 60
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:57019:27017"]
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 2s
      timeout: 5s
      retries: 60
  rabbitmq:
    image: rabbitmq:4.4-alpine
    environment:
      RABBITMQ_CTL_ERL_ARGS: "+S 1:1 +A 1"
    ports: ["127.0.0.1:55679:5672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 30s
      retries: 60
