name: check
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["24.15.0", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
      - run: npm ci
      - run: npm run check
  adapters:
    # mongod 8 refuses Linux 6.19+ (SERVER-121912); ubuntu-latest runners now mix in 7.0 kernels.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: docker compose -f compose.test.yml up -d --wait
      - run: docker compose -f compose.test.yml exec -T mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      - run: npm run build
      - run: npm run test:integration
      - if: failure()
        run: docker compose -f compose.test.yml logs --tail 50
      - if: always()
        run: docker compose -f compose.test.yml down -v
